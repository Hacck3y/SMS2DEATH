plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hacck3y.sms2death'
    compileSdk 35
    defaultConfig {
        applicationId "com.hacck3y.sms2death"
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName "2.0"
        resConfigs "en"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
